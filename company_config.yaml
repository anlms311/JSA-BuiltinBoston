# ════════════════════════════════════════════════════════════════════════════
#  New-Company Detector — Configuration
#  Watches incubators, VC portfolios, and news for new neuro / gene-therapy /
#  gene-editing companies in the Boston biotech ecosystem.
# ════════════════════════════════════════════════════════════════════════════

# ── Focus areas ───────────────────────────────────────────────────────────────
# A company is flagged if its homepage / description hits these. Two or more
# hits (or two areas) = high confidence; a single hit = low confidence (flagged).
focus_keywords:
  neuroscience:
    - neuroscience
    - neurology
    - neurological
    - neurodegenerative
    - neurodegeneration
    - CNS
    - central nervous system
    - brain
    - neuronal
    - neuron
    - synaptic
    - Alzheimer
    - Parkinson
    - ALS
    - Huntington
    - epilepsy
    - frontotemporal
    - motor neuron
    - glioblastoma
    - neuropsychiatric
    - neuromuscular
    - neuroimmunology
    - psychiatry
    - psychiatric
    - neurodevelopmental
    - neuroinflammation
    - neuroinflammatory
    - tauopathy
    - amyotrophic lateral sclerosis
    - spinal muscular atrophy
    - SMA
    - multiple sclerosis
    - astrocyte
    - microglia
    - oligodendrocyte
    - blood-brain barrier
    - BBB
    - Rett
    - Dravet
    - fragile X
    - Friedreich

  gene_therapy:
    - gene therapy
    - gene therapies
    - AAV
    - adeno-associated virus
    - viral vector
    - lentiviral
    - gene delivery
    - genetic medicine
    - genetic medicines
    - in vivo gene
    - rare genetic
    - monogenic
    - AAV9
    - AAV capsid
    - serotype
    - delivery vehicle
    - LNP
    - lipid nanoparticle
    - mRNA
    - siRNA
    - antisense
    - ASO
    - RNAi
    - oligonucleotide

  gene_editing:
    - gene editing
    - genome editing
    - CRISPR
    - base editing
    - prime editing
    - Cas9
    - Cas12
    - epigenetic editing
    - epigenome editing
    - zinc finger
    - TALEN
    - homology directed repair
    - DNA repair
    - genetic
    - CRISPR-Cas
    - Cas13
    - dCas9
    - nuclease
    - knock-in
    - knock-out
    - HDR

